# Source models for the "Vulkan Models" group — everything convert-models.py
# needs to turn a PyTorch release into the ncnn .param/.bin pair the app
# downloads from dl.proxy-scaler.com/models/ncnn/v1/<id>.{param,bin}.
#
# Keys are the UpscaleModel ids (upscale.py). Per model:
#   arch          spandrel architecture, for the record
#   source_url    the author's PyTorch release (.pth/.safetensors)
#   source_sha256 pin; a changed upstream file must be a deliberate bump
#   official_ncnn optional: {param = url, bin = url} when the author ships
#                 ncnn files -- taken as-is (blob names checked), not re-converted
#   license / author / homepage   attribution for README + THIRD_PARTY.md
#
# Candidate set for the bake-off; the ones that ship are whichever
# upscale.py::_WEIGHTS lists. Sha pins are filled in by
# `convert-models.py pin <id>`. Bake-off outcome (2026-09-23, six real
# cards vs UltraSharpV2): realesrgan_anime_fast_vk and animesharp_vk ship —
# the only two that held fine detail and left the card's colours alone.
# ultrasharp_v1_vk, clearreality_v1_vk, nomos8ksc_vk, nomosuni_span_vk,
# hfa2k_vk and realesrgan_anime6b_vk converted and gated fine but were
# judged not good enough, so they stay here only as recipes (their files
# remain on the bucket, unreferenced).

[realesrgan_anime_fast_vk]
arch = "Compact (SRVGGNetCompact)"
author = "Xintao Wang et al. (Real-ESRGAN)"
license = "BSD-3-Clause"
homepage = "https://github.com/xinntao/Real-ESRGAN"
source_url = "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-animevideov3.pth"
source_sha256 = "b8a8376811077954d82ca3fcf476f1ac3da3e8a68a4f4d71363008000a18b75d"
[realesrgan_anime_fast_vk.official_ncnn]
archive = "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip"
param = "models/realesr-animevideov3-x4.param"
bin = "models/realesr-animevideov3-x4.bin"

