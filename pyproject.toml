[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-scaler"
version = "0.1.0"
description = "Fetch Scryfall MTG card images and upscale them for home proxy printing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10",
  "requests>=2.31",
  "torch>=2.1,<3",
  "torchvision>=0.16",
  "spandrel>=0.4",
  "streamlit>=1.28",
  "fpdf2>=2.7",
]

[project.optional-dependencies]
# Windows-only: gives supervisor.py a Job Object (KILL_ON_JOB_CLOSE) so
# Streamlit/worker are guaranteed cleaned up even if the supervisor itself
# is force-killed. Falls back to a taskkill-based best-effort without it.
win32 = ["pywin32; sys_platform == 'win32'"]

[project.scripts]
proxy-scaler = "proxy_scaler.cli:main"
proxy-scaler-serve = "proxy_scaler.supervisor:cli_main"

[tool.setuptools.packages.find]
include = ["proxy_scaler*"]
