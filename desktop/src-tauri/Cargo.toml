[package]
name = "proxy-scaler-spike"
version = "0.1.0"
description = "Phase 0 spike: validate Tauri webview + Streamlit websocket behavior"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "time", "signal"] }
# Local project store (see project_store.rs / ARCHITECTURE.md): "bundled"
# compiles SQLite in rather than requiring a system libsqlite3-dev, which
# matters for a from-scratch build on a machine that hasn't set one up.
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
# Downloads are fetched here in Rust, never in the webview — see
# main.rs::download_to_file for why. rustls rather than the default
# native-tls so this doesn't need a system OpenSSL to build.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# StreamExt, for consuming reqwest's chunked body stream so a download can
# report progress as it goes instead of only when it completes.
futures-util = { version = "0.3", default-features = false }
