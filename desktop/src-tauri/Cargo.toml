[package]
name = "proxy-scaler-spike"
version = "0.1.0"
description = "proxy-scaler desktop app: decklist import, upscaled proxy generation, and PDF export"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# The close handshake's waiting is the part worth testing (see main.rs's
# tests) — "rt"/"macros" to run an async test at all, "test-util" for a
# paused clock so asserting on a 3-second timeout costs no seconds.
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# Second launches focus the existing window instead of racing it: in Local
# mode a second copy spawns its own sidecar supervisor onto port 13207,
# which loses the bind and fails startup confusingly — see main().
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time", "signal"] }
# Local project store (see project_store.rs / ARCHITECTURE.md): "bundled"
# compiles SQLite in rather than requiring a system libsqlite3-dev, which
# matters for a from-scratch build on a machine that hasn't set one up.
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
# Parsing the update manifest (update.rs) — reqwest is built without its
# "json" feature here, so the body is read as bytes and fed to serde_json
# directly. Already in the dependency tree via tauri itself.
serde_json = "1"
# Downloads are fetched here in Rust, never in the webview — see
# main.rs::download_to_file for why. rustls rather than the default
# native-tls so this doesn't need a system OpenSSL to build.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# StreamExt, for consuming reqwest's chunked body stream so a download can
# report progress as it goes instead of only when it completes.
futures-util = { version = "0.3", default-features = false }
# Integrity check on downloaded installers (update.rs::launch_installer):
# a truncated/corrupted multi-GB download must be caught before it's
# handed to an installer that's about to replace a working install.
sha2 = "0.10"
# Authenticity check on the update manifest (update.rs): the manifest
# names the installer URL *and* its sha256, so without a signature over
# the manifest itself, whoever can alter the hosted file picks both the
# payload and the hash it must match. Verify-only and dependency-free —
# the same crate Tauri's own updater plugin verifies with.
minisign-verify = "0.2"
