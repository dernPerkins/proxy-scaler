[package]
name = "proxy-scaler-server"
version = "0.1.0"
description = "Runs the proxy-scaler generation server so other machines can connect to it"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon is what lets the window minimise to the menu bar / system tray
# instead of quitting — the whole point of a server app you leave running.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
# Second launches focus the existing instance instead of spawning a second
# supervisor that loses the port-13207 bind race — see main() for the
# observed failure this prevents.
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The boot-time update notice (check_update_notice in main.rs) fetches
# the release manifest here in Rust, matching the client's reasoning
# (desktop/src-tauri/src/update.rs): reqwest is CORS-exempt, so the
# manifest host needs no CORS setup. Same rustls-not-OpenSSL choice as
# the client's Cargo.toml.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Authenticity check on that manifest — same reasoning and same pinned
# public key as the client's update.rs: the manifest is only trusted
# after its minisign signature verifies.
minisign-verify = "0.2"
